schema_version: 1
updated: 2026-09-17
dataset: MOSEI
data:
  source: CMU-MOSEI third-party benchmark features
  local_filename: unaligned_50.pkl
  sha256: not_recorded
  redistribution: prohibited
seeds: [1111, 1112, 1113]
training_contract:
  epochs: 25
  checkpoint_selection: minimum validation loss
  use_budgeted_aux: true
  use_interventional_reliability: true
  warmup_epoch: 10
  budget_warmup_mode: allocation
  reliability_task_warmup_epoch: 10
  reliability_task_corrupt_scale: 0.0
  delta_va: 0.3
  delta_nce: 0.001
variants:
  repaired_mfon:
    status: complete
    exp_name: p5_mosei_repaired_baseline
    train_args: [--dataset, MOSEI, --stage, train-fusion, --epochs, '25']
    test_args: [--dataset, MOSEI, --stage, test-fusion]
  p4_constant:
    status: complete
    exp_name: p5_mosei_p4_constant_true_budget
    allocation_control: constant
  p4_learned:
    status: complete
    exp_name: p5_mosei_p4_learned_true_budget
    allocation_control: learned
  p4_permuted:
    status: partial
    completed_seeds: [1111]
    exp_name: p5_mosei_p4_permuted_true_budget
    allocation_control: permuted
  p4_inverse:
    status: partial
    completed_seeds: [1111]
    exp_name: p5_mosei_p4_inverse_true_budget
    allocation_control: inverse
audit_contract:
  cross_sample_validity:
    status: complete
    completed: 2026-09-15
    design: post-hoc exploratory
    first_split: valid
    evaluated_split: valid
    test_split: not_run
    n_per_seed: 1871
    result: not_supported
    primary_proxy: per-sample KL, compared globally across samples
    secondary_proxies:
      - per-sample InfoNCE, compared only within the generating mini-batch
      - delta_va * KL + delta_nce * InfoNCE, compared only within the generating mini-batch
    controls: [active_sequence_length, active_feature_rms]
    checkpoint_variant: p4_learned
    summary_mean_sample_sd:
      vision_global_spearman: [-0.315423, 0.069633]
      vision_partial_spearman: [-0.248627, 0.064859]
      vision_pairwise_concordance: [0.393666, 0.023143]
      audio_global_spearman: [0.092174, 0.042066]
      audio_partial_spearman: [0.072239, 0.067445]
      audio_pairwise_concordance: [0.529795, 0.014286]
      vision_weighted_proxy_within_batch_spearman: [-0.290099, 0.047795]
      audio_weighted_proxy_within_batch_spearman: [0.064885, 0.047447]
  modality_utility:
    status: tool_ready_server_validation_pending
    design: post-hoc exploratory
    split: test
    baseline_defines_strata: true
    controls: [repaired_mfon, p4_constant, p4_learned]
    strata: [low, middle, high]
    modalities: [vision, audio]
    metrics: [MAE, Corr, Loss]
